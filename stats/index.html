<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Воронка · Свежий Вздох</title>
<style>
:root{
  --paper:#FBFAF7; --ink:#15211B; --ink-soft:#4A6157; --line:#E2E8E4;
  --green-deep:#1A5C3E; --green-mid:#2A7A55; --green-pale:#E7F5EC;
  --amber:#B8781F; --amber-bg:#FDF6E7;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;}
.wrap{max-width:720px;margin:0 auto;padding:34px 20px 80px;}

.hero{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px;}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:var(--green-mid);margin-bottom:10px;}
h1{font-size:clamp(1.7rem,5.5vw,2.3rem);line-height:1.12;font-weight:900;
  letter-spacing:-.03em;margin-bottom:12px;}
.lead{font-size:.96rem;color:var(--ink-soft);}

h2{font-size:1.15rem;font-weight:900;letter-spacing:-.02em;margin:38px 0 14px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.card .n{font-size:2rem;font-weight:900;letter-spacing:-.03em;color:var(--green-deep);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.card .l{font-size:.82rem;color:var(--ink-soft);margin-top:4px;}

.steps{display:flex;flex-direction:column;gap:9px;margin:18px 0;}
.step{background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:14px 16px;position:relative;overflow:hidden;}
.step .bar{position:absolute;inset:0 auto 0 0;background:var(--green-pale);z-index:0;
  transition:width .6s cubic-bezier(.2,.7,.3,1);width:0;}
.step .row{position:relative;z-index:1;display:flex;align-items:baseline;
  justify-content:space-between;gap:10px;flex-wrap:wrap;}
.step .name{font-weight:700;font-size:.95rem;}
.step .val{font-weight:900;font-size:1.1rem;font-variant-numeric:tabular-nums;
  color:var(--green-deep);}
.step .pct{font-size:.8rem;color:var(--ink-soft);font-weight:600;
  font-variant-numeric:tabular-nums;}
.step .hint{position:relative;z-index:1;font-size:.8rem;color:var(--ink-soft);margin-top:3px;}

table{width:100%;border-collapse:collapse;font-size:.92rem;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800;}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}

.note{background:var(--amber-bg);border:1px solid #F0DCAF;border-radius:13px;
  padding:15px 17px;margin:22px 0;font-size:.9rem;color:#6B4E14;line-height:1.55;}
.note b{color:var(--amber);}

.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:.8rem;color:#8A9C93;line-height:1.55;}
.err{background:#FCF0EE;border:1px solid #F0CFCA;color:#8C2F26;
  border-radius:13px;padding:15px 17px;font-size:.9rem;}
.load{color:var(--ink-soft);font-size:.9rem;}
@media (max-width:420px){ .card .n{font-size:1.7rem} }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">Свежий Вздох</div>
    <h1>Воронка в цифрах</h1>
    <p class="lead">Живые данные из бота. Обновляются при каждом открытии страницы.
      Здесь только общие числа: ни имён, ни контактов, ни сумм.</p>
  </div>

  <div id="app"><p class="load">Загружаю данные…</p></div>

  <div class="foot">
    Источник: телеграм-бот «Свежий Вздох».<br>
    Обновлено: <span id="gen">·</span>
  </div>

</div>

<script>
const API = 'https://svezhiy-vzdoh.ru/public-stats';

const STEPS = [
  ['entered',       'Зашли в бота',        'нажали старт'],
  ['diag',          'Прошли диагностику',  'ответили на вопросы о своей зависимости'],
  ['razbor_sent',   'Получили разбор',     'бот прислал персональный разбор'],
  ['razbor_opened', 'Открыли разбор',      'перешли на страницу и прочитали'],
  ['site',          'Дошли до сообщества', 'открыли страницу клуба'],
  ['purchased',     'Оплатили',            'вступили в клуб'],
];

const SOURCES = {
  instagram:'Instagram', ig:'Instagram (по ссылке)', yandex:'Яндекс',
  direct:'Напрямую', wall:'Стена', youtube:'YouTube', vk:'ВКонтакте',
};

const nf = n => (n ?? 0).toLocaleString('ru-RU');

fetch(API)
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      '<div class="err"><b>Не удалось получить данные.</b><br>' +
      'Возможно, бот сейчас перезапускается. Обновите страницу через минуту.<br>' +
      '<small>' + e.message + '</small></div>';
  });

function render(d){
  const f = d.funnel || {};
  const base = f.entered || 0;

  let html = '<div class="cards">';
  html += card(nf(d.users_total), 'человек в базе');
  html += card(nf(base), 'прошли через воронку');
  html += card(nf(d.club_active), 'в клубе сейчас');
  html += '</div>';

  html += '<h2>Путь человека по шагам</h2><div class="steps">';
  for(const [key, name, hint] of STEPS){
    const v = f[key] ?? 0;
    const pct = base ? Math.round(v / base * 100) : 0;
    html +=
      '<div class="step">' +
        '<div class="bar" data-w="' + pct + '"></div>' +
        '<div class="row">' +
          '<span class="name">' + name + '</span>' +
          '<span><span class="val">' + nf(v) + '</span> ' +
          '<span class="pct">' + pct + '% от зашедших</span></span>' +
        '</div>' +
        '<div class="hint">' + hint + '</div>' +
      '</div>';
  }
  html += '</div>';

  const src = d.sources || {};
  const rows = Object.entries(src).sort((a,b) => b[1] - a[1]);
  if(rows.length){
    const tot = rows.reduce((s,[,v]) => s + v, 0);
    html += '<h2>Откуда приходят</h2><table><tr><th>Источник</th><th class="num">Человек</th><th class="num">Доля</th></tr>';
    for(const [k,v] of rows){
      const pct = tot ? Math.round(v / tot * 100) : 0;
      html += '<tr><td>' + (SOURCES[k] || k) + '</td><td class="num">' + nf(v) +
              '</td><td class="num">' + pct + '%</td></tr>';
    }
    html += '</table>';
  }

  if((f.purchased ?? 0) === 0 && base > 0){
    html += '<div class="note"><b>Продаж через эту воронку пока нет.</b> ' +
            'Она запущена недавно, и через неё прошло ' + nf(base) + ' человек. ' +
            'Этого мало, чтобы судить о конверсии: выборка слишком маленькая. ' +
            'Люди в клубе пришли другим путём, раньше.</div>';
  }

  document.getElementById('app').innerHTML = html;
  document.getElementById('gen').textContent = fmtDate(d.generated_at);
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar').forEach(b => b.style.width = b.dataset.w + '%');
  });
}

function card(n, l){
  return '<div class="card"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
}

function fmtDate(s){
  if(!s) return '·';
  try{
    return new Date(s).toLocaleString('ru-RU',
      {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return s; }
}
</script>
</body>
</html>
