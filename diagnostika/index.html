<body>

<div class="app">
  <div class="topbar" id="topbar">
    <button class="back" id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19"/></svg></button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="step-n" id="stepn"></div>
  </div>
  <main class="stage" id="stage"></main>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';

const stage=document.getElementById('stage'), topbar=document.getElementById('topbar');
const fill=document.getElementById('fill'), stepn=document.getElementById('stepn'), backBt=document.getElementById('back');

const STORE='vzdoh_diag_v2';
const LETTER={habit:'h',psycho:'p',stress:'s',physical:'f',social:'o',fear_break:'b',fear_weight:'w',low_belief:'l',focus:'c'};

let answers=[], pos=-1, moneyK=1;

function save(){ try{ localStorage.setItem(STORE, JSON.stringify({a:answers,p:pos,k:moneyK})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(STORE)||'null');
  if(d&&Array.isArray(d.a)){ answers=d.a; pos=typeof d.p==='number'?d.p:-1; moneyK=d.k||1; } }catch(e){} }
function goal(n){ if(window.ym) try{ ym(CONFIG.metrikaId,'reachGoal',n); }catch(e){} }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
function plural(n,a,b,c){ const x=n%10,y=n%100; if(x===1&&y!==11)return a; if(x>=2&&x<=4&&(y<12||y>14))return b; return c; }

/* значение ответа по служебному ключу */
function val(key){
  const i = QUESTIONS.findIndex(q => q.key === key);
  if (i < 0 || answers[i] == null) return null;
  const o = QUESTIONS[i].a[answers[i]];
  return o ? (o.v !== undefined ? o.v : answers[i]) : null;
}

/* ─── ДЕНЬГИ ─── */
function moneyCalc(){
  const perday = val('perday') || 12;      // условных единиц в день
  const price  = val('price')  || 220;     // цена одной покупки
  const years  = val('years')  || 7;
  const perUnit = price / 20;              // пачка ≈ 20 единиц
  const day   = perUnit * perday * moneyK;
  return { month: day*30, year: day*365, total: day*365*years, years: years };
}

/* ─── СТАДИЯ ЗАВИСИМОСТИ (по классификации доктора Звягина) ─── */
function stageOf(){
  const years=val('years'), carry=val('carry'), alone=val('alone'),
        dry=val('dry'), control=val('control'), perday=val('perday'), morning=val('morning');

  // 3-я: каждый день без пропусков + много + границы сдвинулись + утренняя сразу
  let third = 0;
  if (dry === 'never') third++;
  if (perday >= 20) third++;
  if (control === 'lost') third++;
  if (morning !== null && morning <= 30) third++;
  if (carry === 'always') third++;
  if (third >= 4) return 3;

  // 1-я: мало лет, не носит с собой, только в компании, есть длинные перерывы
  let first = 0;
  if (years !== null && years < 1) first++;
  if (carry === 'no') first++;
  if (alone === 'social') first++;
  if (dry === 'long') first++;
  if (first >= 3) return 1;

  return 2;
}

/* ─── ПРОФИЛЬ ─── */
function score(){
  const raw={}, max={};
  CATEGORIES.forEach(c=>{raw[c.code]=0;max[c.code]=0;});
  QUESTIONS.forEach((q,i)=>{
    CATEGORIES.forEach(c=>{ let b=0; q.a.forEach(o=>{const v=(o.s&&o.s[c.code])||0; if(v>b)b=v;}); max[c.code]+=b; });
    const ch=q.a[answers[i]];
    if(ch&&ch.s) for(const k in ch.s) if(raw[k]!==undefined) raw[k]+=ch.s[k];
  });
  const list=CATEGORIES.map(c=>{
    let pct=Math.round((raw[c.code]/(max[c.code]||1))*100);
    pct=Math.max(8,Math.min(94,pct));
    return {code:c.code,label:c.label,icon:c.icon,pct:pct,raw:raw[c.code]};
  });
  list.sort((a,b)=>b.pct-a.pct||b.raw-a.raw);
  if(list[0].pct<72) list[0].pct=72+(list[0].raw%9);
  return list;
}

function payload(list){
  const d=QUESTIONS.map((q,i)=>answers[i]==null?'x':String(answers[i])).join('');
  return 'd2'+d+list.slice(0,3).map(x=>LETTER[x.code]||'x').join('')+'s'+stageOf();
}

/* ─── ОТРИСОВКА ─── */
function paint(html,cls){
  const old=stage.querySelector('.screen');
  const draw=()=>{ stage.innerHTML='<div class="screen '+(cls||'')+'">'+html+'</div>'; window.scrollTo(0,0); };
  if(old){ old.classList.add('leaving'); setTimeout(draw,170); } else draw();
}
function chrome(){
  const T=QUESTIONS.length;
  if(pos>=0&&pos<T){ topbar.classList.add('on'); fill.style.width=(pos/T*100)+'%'; stepn.textContent=(pos+1)+' / '+T; backBt.style.visibility='visible'; }
  else if(pos>=T){ topbar.classList.add('on'); fill.style.width='100%'; stepn.textContent=''; backBt.style.visibility='hidden'; }
  else topbar.classList.remove('on');
}

/* ─── ЭКРАНЫ ─── */
function screenIntro(){
  pos=-1; save(); chrome();
  paint(
    '<div class="badge">'+INTRO.badge+'</div>'+
    '<h1>'+INTRO.title+'</h1>'+
    '<p>'+INTRO.lead+'</p>'+
    '<p>'+INTRO.lead2+'</p>'+
    '<ul class="getlist">'+INTRO.bullets.map(b=>'<li><b>→</b><span>'+b+'</span></li>').join('')+'</ul>'+
    '<div class="intro-meta">'+INTRO.meta.map(m=>'<div class="im"><b>'+m.b+'</b><span>'+m.s+'</span></div>').join('')+'</div>'+
    '<div class="cta-dock"><button class="btn" id="go">'+INTRO.cta+'</button><p class="privacy">'+INTRO.note+'</p></div>',
    'intro');
  document.getElementById('go').onclick=()=>{ goal('diag_start'); step(0); };
}

function screenQuestion(i){
  const q=QUESTIONS[i];
  paint('<h2 class="q">'+q.q+'</h2>'+(q.hint?'<p class="qhint">'+q.hint+'</p>':'')+
    '<div class="opts">'+q.a.map((o,n)=>'<button class="opt'+(answers[i]===n?' sel':'')+'" data-n="'+n+'">'+o.t+'</button>').join('')+'</div>','qwrap');
  setTimeout(()=>{
    stage.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{ answers[i]=+b.dataset.n;
        stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        save(); setTimeout(()=>step(i+1),250); };
    });
  },180);
}

function screenMoney(nextPos){
  const m=moneyCalc();
  paint(
    '<div class="mid-icon">'+MONEY.icon+'</div>'+
    '<h2>'+MONEY.title+'</h2>'+
    '<p>'+MONEY.lead+'</p>'+
    '<div class="money"><b>'+fmt(m.month)+' ₽</b><span>в месяц уходит на никотин</span></div>'+
    '<p style="font-weight:700;color:#fff;margin-top:2px">'+MONEY.ask+'</p>'+
    '<div class="opts" style="margin-top:-6px">'+
      MONEY.opts.map((o,n)=>'<button class="opt" data-k="'+o.k+'">'+o.t+'</button>').join('')+
    '</div>','mid');
  setTimeout(()=>{
    stage.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{ moneyK=parseFloat(b.dataset.k)||1; save(); screenMoney2(nextPos); };
    });
  },180);
}

function screenMoney2(nextPos){
  const m=moneyCalc();
  paint(
    '<div class="mid-icon">🔥</div>'+
    '<h2>Тогда вот полная картина</h2>'+
    '<div class="money"><b>'+fmt(m.year)+' ₽</b><span>вы отдаёте за никотин каждый год</span></div>'+
    '<div class="money alt"><b>'+fmt(m.total)+' ₽</b><span>уже ушло дымом за '+m.years+' '+plural(Math.round(m.years),'год','года','лет')+'</span></div>'+
    '<p>'+MONEY.outro+'</p>'+
    '<div class="cta-dock"><button class="btn" id="cont">Продолжить</button></div>','mid');
  setTimeout(()=>{ const c=document.getElementById('cont'); if(c) c.onclick=()=>step(nextPos,true); },180);
}

function screenInterlude(it,nextPos){
  if(it.kind==='money') return screenMoney(nextPos);
  paint('<div class="mid-icon">'+it.icon+'</div><h2>'+it.title+'</h2><p>'+it.body+'</p>'+
    '<div class="cta-dock"><button class="btn" id="cont">Продолжить</button></div>','mid');
  setTimeout(()=>{ const c=document.getElementById('cont'); if(c) c.onclick=()=>step(nextPos,true); },180);
}

function screenAnalysis(){
  pos=QUESTIONS.length; save(); chrome(); goal('diag_analysis');
  paint('<h2>Анализируем ваши ответы</h2><div class="an-list">'+
    ANALYSIS_STEPS.map((s,i)=>'<div class="an-row" id="ar'+i+'"><div class="an-head"><span class="an-name">'+s+'</span><span class="an-val" id="av'+i+'">0%</span></div><div class="an-bar"><i id="ab'+i+'"></i></div></div>').join('')+
    '</div>','an');
  const per=CONFIG.analysisMs/ANALYSIS_STEPS.length;
  setTimeout(()=>{
    ANALYSIS_STEPS.forEach((s,i)=>{
      setTimeout(()=>{
        const row=document.getElementById('ar'+i),v=document.getElementById('av'+i),bar=document.getElementById('ab'+i);
        if(!row)return; row.classList.add('on');
        let p=0; const tick=setInterval(()=>{ p+=Math.random()*13+5; if(p>=100){p=100;clearInterval(tick);}
          if(v)v.textContent=Math.round(p)+'%'; if(bar)bar.style.width=p+'%';
          if(p===100&&v)v.innerHTML='&#10003;'; },per/11);
      },i*per);
    });
    setTimeout(screenResult,CONFIG.analysisMs+350);
  },200);
}

function screenResult(){
  pos=QUESTIONS.length+1; save(); chrome(); goal('diag_result');

  const list=score(), top=list[0], prof=PROFILES[top.code]||PROFILES.habit;
  const st=stageOf(), S=STAGES[st], m=moneyCalc();

  const bars=list.slice(0,5).map((c,i)=>
    '<div class="bar-row'+(i===0?' top':'')+'"><div class="bar-head"><span class="bar-name">'+c.icon+' '+c.label+'</span><span class="bar-pct">'+c.pct+'%</span></div><div class="bar-track"><i data-w="'+c.pct+'"></i></div></div>').join('');

  const video=prof.video
    ? '<div class="video-box"><video src="'+prof.video+'" controls playsinline preload="metadata"></video></div>'
    : '<div class="video-box"><div class="video-ph"><span class="vi">🎬</span><b>Здесь будет видео Артура</b><span>Разбор именно вашего типа зависимости — записывается</span></div></div>';

  const steps=METHOD.steps.map((s,i)=>
    '<div class="mstep"><div class="mstep-n"><span class="mstep-num">'+(i+1)+'</span><span class="mstep-cat">'+s.n+'</span></div><h4>'+s.t+'</h4><p>'+s.d+'</p></div>').join('');

  const pl=payload(list);
  const bot=CONFIG.botLink.replace('{payload}',pl);
  const land=CONFIG.landingLink.replace('{code}',top.code);

  paint(
    '<div class="eyebrow">Ваш результат</div>'+
    '<h1>'+prof.title+'</h1>'+
    '<div class="bars">'+bars+'</div>'+
    '<div class="card"><h3>Что это значит</h3><p>'+prof.verdict+'</p></div>'+
    '<div class="card"><h3>Почему срывались раньше</h3><p>'+prof.why+'</p></div>'+

    '<div class="card warn"><span class="stage-badge">'+S.n+'</span>'+
      '<h3 style="margin-top:2px">'+S.lead+'</h3>'+
      '<p>'+S.body+'</p><p><strong>'+S.warn+'</strong></p>'+
      '<p style="font-size:.85rem;color:var(--w70)">Классификация стадий — по курсу доктора А. В. Звягина о никотиновой зависимости.</p>'+
    '</div>'+

    '<div class="card"><h3>За это время вы отдали</h3>'+
      '<p style="font-size:1.5rem;font-weight:800;color:var(--acc);letter-spacing:-.02em">'+fmt(m.total)+' ₽</p>'+
      '<p>И продолжаете отдавать примерно '+fmt(m.month)+' ₽ каждый месяц.</p></div>'+

    video+
    '<div class="card"><h3>Что с этим делаем</h3><ul class="plan">'+prof.plan.map(p=>'<li><b>—</b><span>'+p+'</span></li>').join('')+'</ul></div>'+

    '<div class="method-head"><h2>'+METHOD.title+'</h2><p>'+METHOD.lead+'</p></div>'+
    steps+
    '<div class="card"><h3>Сработает ли это у вас</h3><p>'+prof.fit+'</p></div>'+
    '<div class="card warn"><h3>'+METHOD.honest.title+'</h3><p>'+METHOD.honest.body+'</p><p><strong>'+METHOD.honest.body2+'</strong></p></div>'+

    '<div class="outro"><h2>'+OUTRO.title+'</h2><p>'+OUTRO.body+'</p></div>'+
    '<div class="cta-dock">'+
      '<a class="btn" id="toplan" href="'+land+'">'+OUTRO.cta+'</a>'+
      '<a class="btn btn-ghost" id="tobot" href="'+bot+'" target="_blank" rel="noopener">Отправить результат Артуру</a>'+
      '<p class="privacy">Диагностика носит информационный характер и не является медицинским заключением.</p>'+
    '</div>','res');

  setTimeout(()=>{
    stage.querySelectorAll('.bar-track i').forEach((el,i)=>setTimeout(()=>{el.style.width=el.dataset.w+'%';},90+i*110));
    const a=document.getElementById('toplan'); if(a)a.onclick=()=>goal('diag_to_landing');
    const b=document.getElementById('tobot'); if(b)b.onclick=()=>goal('diag_to_bot');
  },220);
}

/* ─── НАВИГАЦИЯ ─── */
function step(i,skipInterlude){
  if(i<0) return screenIntro();
  if(i>=QUESTIONS.length) return screenAnalysis();
  if(!skipInterlude){
    const it=INTERLUDES.find(x=>x.after===i);
    if(it){ pos=i; save(); chrome(); return screenInterlude(it,i); }
  }
  pos=i; save(); chrome(); screenQuestion(i);
}
backBt.onclick=()=>{ if(pos<=0) return screenIntro(); step(pos-1,true); };

load();
if(pos>=QUESTIONS.length+1 && answers.filter(x=>x!=null).length===QUESTIONS.length) screenResult();
else if(pos>=0 && pos<QUESTIONS.length) step(pos,true);
else screenIntro();
})();
</script>
</body>
</html>
