<div class="app">
  <div class="topbar" id="topbar">
    <button class="back" id="back" aria-label="Назад">
      <svg viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19"/></svg>
    </button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="step-n" id="stepn"></div>
  </div>
  <main class="stage" id="stage"></main>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';

const stage  = document.getElementById('stage');
const topbar = document.getElementById('topbar');
const fill   = document.getElementById('fill');
const stepn  = document.getElementById('stepn');
const backBt = document.getElementById('back');

const STORE = 'vzdoh_diag_v1';
const LETTER = { habit:'h', psycho:'p', stress:'s', physical:'f', social:'o',
                 fear_break:'b', fear_weight:'w', low_belief:'l', focus:'c' };

let answers = [];   // индексы выбранных вариантов
let pos     = -1;   // -1 интро, 0..N-1 вопросы, N анализ, N+1 результат

/* ─── СОХРАНЕНИЕ ─── */
function save(){
  try { localStorage.setItem(STORE, JSON.stringify({ a: answers, p: pos })); } catch(e){}
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (d && Array.isArray(d.a)) { answers = d.a; pos = typeof d.p === 'number' ? d.p : -1; }
  } catch(e){}
}
function goal(name){ if (window.ym) try { ym(CONFIG.metrikaId, 'reachGoal', name); } catch(e){} }

/* ─── ПОДСЧЁТ ПРОФИЛЯ ─── */
function score(){
  const raw = {}, max = {};
  CATEGORIES.forEach(c => { raw[c.code] = 0; max[c.code] = 0; });

  QUESTIONS.forEach((q, i) => {
    // потолок по вопросу — самый щедрый вариант для каждой категории
    CATEGORIES.forEach(c => {
      let best = 0;
      q.a.forEach(o => { const v = (o.s && o.s[c.code]) || 0; if (v > best) best = v; });
      max[c.code] += best;
    });
    const chosen = q.a[answers[i]];
    if (chosen && chosen.s) {
      for (const k in chosen.s) if (raw[k] !== undefined) raw[k] += chosen.s[k];
    }
  });

  const list = CATEGORIES.map(c => {
    const m = max[c.code] || 1;
    let pct = Math.round((raw[c.code] / m) * 100);
    // держим в живом диапазоне: без 0% и без 100%
    pct = Math.max(8, Math.min(94, pct));
    return { code:c.code, label:c.label, icon:c.icon, pct:pct, raw:raw[c.code] };
  });

  // сортируем по проценту — именно он показывается человеку,
  // порядок баров обязан совпадать с цифрами
  list.sort((a,b) => b.pct - a.pct || b.raw - a.raw);
  // верхнюю подтягиваем повыше, чтобы диагноз читался уверенно
  if (list[0].pct < 72) list[0].pct = 72 + (list[0].raw % 9);
  return list;
}

function payload(list){
  const digits = QUESTIONS.map((q,i) => (answers[i] == null ? 'x' : String(answers[i]))).join('');
  const top3 = list.slice(0,3).map(x => LETTER[x.code] || 'x').join('');
  return 'd1' + digits + top3;
}

/* ─── ОТРИСОВКА ─── */
function paint(html, cls){
  const old = stage.querySelector('.screen');
  const draw = () => {
    stage.innerHTML = '<div class="screen ' + (cls||'') + '">' + html + '</div>';
    window.scrollTo(0,0);
  };
  if (old) { old.classList.add('leaving'); setTimeout(draw, 170); }
  else draw();
}

function chrome(){
  const total = QUESTIONS.length;
  if (pos >= 0 && pos < total) {
    topbar.classList.add('on');
    fill.style.width = ((pos) / total * 100) + '%';
    stepn.textContent = (pos + 1) + ' / ' + total;
    backBt.style.visibility = 'visible';
  } else if (pos >= total) {
    topbar.classList.add('on');
    fill.style.width = '100%';
    stepn.textContent = '';
    backBt.style.visibility = 'hidden';
  } else {
    topbar.classList.remove('on');
  }
}

/* ─── ЭКРАНЫ ─── */
function screenIntro(){
  pos = -1; save(); chrome();
  paint(
    '<div class="intro-badge">Бесплатная диагностика</div>' +
    '<h1>Почему <em>именно вы</em> до сих пор не бросили курить</h1>' +
    '<p>15 вопросов о том, как устроено ваше курение. По ответам я определю главную причину вашей зависимости и покажу, что именно ломало ваши прошлые попытки.</p>' +
    '<div class="intro-meta">' +
      '<div class="im"><b>15</b><span>вопросов</span></div>' +
      '<div class="im"><b>3</b><span>минуты</span></div>' +
      '<div class="im"><b>9</b><span>типов зависимости</span></div>' +
    '</div>' +
    '<div class="cta-dock">' +
      '<button class="btn" id="go">Начать диагностику</button>' +
      '<p class="privacy">Без регистрации и без почты. Ответы остаются в вашем браузере.</p>' +
    '</div>',
    'intro'
  );
  document.getElementById('go').onclick = () => { goal('diag_start'); step(0); };
}

function screenQuestion(i){
  const q = QUESTIONS[i];
  const opts = q.a.map((o, n) =>
    '<button class="opt' + (answers[i] === n ? ' sel' : '') + '" data-n="' + n + '">' + o.t + '</button>'
  ).join('');

  paint(
    '<h2 class="q">' + q.q + '</h2>' +
    (q.hint ? '<p class="qhint">' + q.hint + '</p>' : '') +
    '<div class="opts">' + opts + '</div>',
    'qwrap'
  );

  setTimeout(() => {
    stage.querySelectorAll('.opt').forEach(b => {
      b.onclick = () => {
        const n = +b.dataset.n;
        answers[i] = n;
        stage.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        save();
        setTimeout(() => step(i + 1), 250);
      };
    });
  }, 180);
}

function screenInterlude(it, nextPos){
  let body = '';
  if (it.kind === 'money') {
    const perDay = [3, 8, 13, 18, 25][answers[1] != null ? answers[1] : 2];
    const years  = [3, 8, 15, 25, 34][answers[0] != null ? answers[0] : 2];
    const yearRub  = Math.round(perDay / 20 * CONFIG.packPrice * 365);
    const spentRub = yearRub * years;
    const fmt = n => n.toLocaleString('ru-RU');
    body =
      '<div class="money"><b>' + fmt(yearRub) + ' ₽</b><span>вы отдаёте за сигареты каждый год</span></div>' +
      '<div class="money"><b>' + fmt(spentRub) + ' ₽</b><span>уже ушло дымом за ' + years + ' ' + plural(years,'год','года','лет') + ' курения</span></div>' +
      '<p>И это только деньги. Время, здоровье и то, чего вы уже не сделали, сюда не входят.</p>';
  } else {
    body = '<p>' + it.body + '</p>';
  }

  paint(
    '<div class="mid-icon">' + it.icon + '</div>' +
    '<h2>' + it.title + '</h2>' +
    body +
    '<div class="cta-dock"><button class="btn" id="cont">Продолжить</button></div>',
    'mid'
  );
  setTimeout(() => {
    const c = document.getElementById('cont');
    if (c) c.onclick = () => step(nextPos, true);
  }, 180);
}

function screenAnalysis(){
  pos = QUESTIONS.length; save(); chrome(); goal('diag_analysis');

  const rows = ANALYSIS_STEPS.map((s, i) =>
    '<div class="an-row" id="ar' + i + '">' +
      '<div class="an-head"><span class="an-name">' + s + '</span><span class="an-val" id="av' + i + '">0%</span></div>' +
      '<div class="an-bar"><i id="ab' + i + '"></i></div>' +
    '</div>'
  ).join('');

  paint('<h2>Анализируем ваши ответы</h2><div class="an-list">' + rows + '</div>', 'an');

  const per = CONFIG.analysisMs / ANALYSIS_STEPS.length;
  setTimeout(() => {
    ANALYSIS_STEPS.forEach((s, i) => {
      setTimeout(() => {
        const row = document.getElementById('ar' + i);
        const val = document.getElementById('av' + i);
        const bar = document.getElementById('ab' + i);
        if (!row) return;
        row.classList.add('on');
        let p = 0;
        const tick = setInterval(() => {
          p += Math.random() * 13 + 5;
          if (p >= 100) { p = 100; clearInterval(tick); }
          if (val) val.textContent = Math.round(p) + '%';
          if (bar) bar.style.width = p + '%';
          if (p === 100 && val) val.innerHTML = '&#10003;';
        }, per / 11);
      }, i * per);
    });
    setTimeout(screenResult, CONFIG.analysisMs + 350);
  }, 200);
}

function screenResult(){
  pos = QUESTIONS.length + 1; save(); chrome(); goal('diag_result');

  const list = score();
  const top  = list[0];
  const prof = PROFILES[top.code] || PROFILES.habit;
  const shown = list.slice(0, 5);

  const bars = shown.map((c, i) =>
    '<div class="bar-row' + (i === 0 ? ' top' : '') + '">' +
      '<div class="bar-head">' +
        '<span class="bar-name">' + c.icon + ' ' + c.label + '</span>' +
        '<span class="bar-pct">' + c.pct + '%</span>' +
      '</div>' +
      '<div class="bar-track"><i data-w="' + c.pct + '"></i></div>' +
    '</div>'
  ).join('');

  const planLis = prof.plan.map(p => '<li><b>—</b><span>' + p + '</span></li>').join('');

  const video = prof.video
    ? '<div class="video-box"><video src="' + prof.video + '" controls playsinline preload="metadata"></video></div>'
    : '<div class="video-box"><div class="video-ph"><span class="vi">🎬</span><b>Здесь будет видео Артура</b>' +
      '<span>Разбор именно вашего типа зависимости — записывается</span></div></div>';

  const pl   = payload(list);
  const bot  = CONFIG.botLink.replace('{payload}', pl);
  const land = CONFIG.landingLink.replace('{code}', top.code);

  paint(
    '<div class="res-eyebrow">Ваш результат</div>' +
    '<h1>' + prof.title + '</h1>' +
    '<div class="bars">' + bars + '</div>' +
    '<div class="card"><h3>Что это значит</h3><p>' + prof.verdict + '</p></div>' +
    '<div class="card"><h3>Почему срывались раньше</h3><p>' + prof.why + '</p></div>' +
    video +
    '<div class="card"><h3>Что с этим делаем</h3><ul class="plan">' + planLis + '</ul></div>' +
    '<div class="outro"><h2>' + OUTRO.title + '</h2><p>' + OUTRO.body + '</p></div>' +
    '<div class="cta-dock">' +
      '<a class="btn" id="toplan" href="' + land + '">' + OUTRO.cta + '</a>' +
      '<a class="btn btn-ghost" id="tobot" href="' + bot + '" target="_blank" rel="noopener">Отправить результат Артуру</a>' +
      '<p class="privacy">Результат сохранён в этом браузере. Диагностика носит информационный характер и не является медицинским заключением.</p>' +
    '</div>',
    'res'
  );

  setTimeout(() => {
    stage.querySelectorAll('.bar-track i').forEach((el, i) => {
      setTimeout(() => { el.style.width = el.dataset.w + '%'; }, 90 + i * 110);
    });
    const a = document.getElementById('toplan');
    if (a) a.onclick = () => goal('diag_to_landing');
    const b = document.getElementById('tobot');
    if (b) b.onclick = () => goal('diag_to_bot');
  }, 220);
}

/* ─── НАВИГАЦИЯ ─── */
function step(i, skipInterlude){
  if (i < 0) return screenIntro();
  if (i >= QUESTIONS.length) return screenAnalysis();

  if (!skipInterlude) {
    const it = INTERLUDES.find(x => x.after === i);
    if (it) { pos = i; save(); chrome(); return screenInterlude(it, i); }
  }
  pos = i; save(); chrome(); screenQuestion(i);
}

backBt.onclick = () => {
  if (pos <= 0) return screenIntro();
  step(pos - 1, true);
};

/* ─── СТАРТ ─── */
load();
if (pos >= QUESTIONS.length + 1 && answers.filter(x => x != null).length === QUESTIONS.length) screenResult();
else if (pos >= 0 && pos < QUESTIONS.length) step(pos, true);
else screenIntro();

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
})();
</script>
