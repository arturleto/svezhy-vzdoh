<script src="../../config.js?v=19"></script>
<script>
(function(){
'use strict';

const STORE = 'vzdoh_gotov_v1';

/* --- URL PARAMS --- */
let fullMode = false, urlUid = '', urlName = '';
try{
  const p = new URLSearchParams(location.search);
  fullMode = p.has('full');
  urlUid = p.get('uid') || '';
  urlName = p.get('name') || '';
}catch(e){}

/* --- LOAD DATA --- */
let answers=[], moneyK=1;
let hasData=false;
try{
  const raw=localStorage.getItem(STORE);
  if(raw){ const d=JSON.parse(raw); if(d&&Array.isArray(d.a)&&d.a.length>0){ answers=d.a; moneyK=d.k||1; hasData=true; } }
}catch(e){}

/* --- FALLBACK: ?d=code --- */
let urlCode='';
try{ urlCode=new URLSearchParams(location.search).get('d')||''; }catch(e){}

if(!hasData && !urlCode){
  location.href='../';
}

/* --- HELPERS (from diagnostic engine) --- */
function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
function usd(rub){
  const r=(typeof CONFIG!=='undefined'&&CONFIG.usdRate)||80;
  const d=rub/r;
  if(d<10) return d.toFixed(1).replace('.',',').replace(',0','')+'$';
  let x=d;
  if(x>=1000) x=Math.round(x/100)*100;
  else if(x>=100) x=Math.round(x/10)*10;
  else x=Math.round(x);
  return x.toLocaleString('ru-RU')+'$';
}
function plural(n,a,b,c){ const x=n%10,y=n%100; if(x===1&&y!==11)return a; if(x>=2&&x<=4&&(y<12||y>14))return b; return c; }
function subst(t){
  if(!t||t.indexOf('{что}')<0) return t;
  const m=mainProduct();
  const w=(typeof PRODUCT_WORDS!=='undefined'&&PRODUCT_WORDS[m])||'запас никотина';
  return t.split('{что}').join(w);
}
function val(key){
  if(!QUESTIONS) return null;
  const i=QUESTIONS.findIndex(q=>q.key===key);
  if(i<0||answers[i]==null) return null;
  const o=QUESTIONS[i].a[answers[i]];
  return o?(o.v!==undefined?o.v:answers[i]):null;
}
function mainProduct(){
  if(!QUESTIONS) return null;
  const i=QUESTIONS.findIndex(q=>q.key==='product');
  if(i<0||answers[i]==null) return null;
  const o=QUESTIONS[i].a[answers[i]];
  return o?o.v:null;
}
function isActive(qi){
  if(!QUESTIONS) return false;
  const q=QUESTIONS[qi], main=mainProduct();
  if(q.product){ if(main===null) return false; if(main==='mix') return true; return q.product!==main; }
  if(q.onlyProduct){ if(main===null) return false; if(main==='mix') return q.onlyProduct==='cig'; return q.onlyProduct===main; }
  if(q.showIf){ const v=val(q.showIf.key); if(v===null) return false; if(q.showIf.not!==undefined&&v===q.showIf.not) return false; if(q.showIf.is!==undefined&&v!==q.showIf.is) return false; }
  return true;
}
function activeList(){ if(!QUESTIONS) return []; const out=[]; for(let i=0;i<QUESTIONS.length;i++) if(isActive(i)) out.push(i); return out; }
function stageOf(){
  const years=val('years'),carry=val('carry'),alone=val('alone'),dry=val('dry'),control=val('control'),perday=val('perday'),morning=val('morning');
  let third=0;
  if(dry==='never') third++; if(perday>=20) third++; if(control==='lost') third++; if(morning!==null&&morning<=30) third++; if(carry==='always') third++; if(alone==='always') third++;
  if(third>=4) return 3;
  let first=0;
  if(years!==null&&years<1) first++; if(carry==='no') first++; if(alone==='social') first++; if(dry==='long') first++;
  if(first>=3) return 1;
  return 2;
}
function score(){
  if(!CATEGORIES||!QUESTIONS) return [];
  const raw={},max={};
  CATEGORIES.forEach(c=>{raw[c.code]=0;max[c.code]=0;});
  activeList().forEach(i=>{
    const q=QUESTIONS[i];
    CATEGORIES.forEach(c=>{
      let b=0;
      if(q.multi){ const v=q.a.map(o=>(o.s&&o.s[c.code])||0).sort((x,y)=>y-x); b=(v[0]||0)+(v[1]||0); }
      else q.a.forEach(o=>{const v=(o.s&&o.s[c.code])||0;if(v>b)b=v;});
      max[c.code]+=b;
    });
    const picked=q.multi?(Array.isArray(answers[i])?answers[i]:[]):[answers[i]];
    picked.forEach(n=>{ const ch=q.a[n]; if(ch&&ch.s) for(const k in ch.s) if(raw[k]!==undefined) raw[k]+=ch.s[k]; });
  });
  const list=CATEGORIES.map(c=>{ let pct=Math.round((raw[c.code]/(max[c.code]||1))*100); pct=Math.max(8,Math.min(94,pct)); return {code:c.code,label:c.label,icon:c.icon,pct:pct,raw:raw[c.code]}; });
  list.sort((a,b)=>b.pct-a.pct||b.raw-a.raw);
  if(list[0]&&list[0].pct<72) list[0].pct=72+(list[0].raw%9);
  return list;
}
function moneyCalc(){
  const P=['cig','vape','heat','snus','hookah'];
  let units=null,price=null;
  P.forEach(p=>{ const u=val('use_'+p); if(u!==null&&units===null) units=u; const c=val('price_'+p); if(c!==null&&price===null) price=c; });
  if(units===null) units=1; if(price===null) price=220;
  const years=val('years')||7;
  const day=units*price*moneyK;
  return {month:day*30,year:day*365,total:day*365*years,years:years,day:day};
}
function riskCard(){
  if(typeof RISK==='undefined'||!RISK.tiers) return '';
  const y=val('years'); if(y===null) return '';
  const t=RISK.tiers.find(x=>y>=x.minYears); if(!t) return '';
  const срок=y<1?'меньше года':fmt(y)+' '+plural(Math.round(y),'год','года','лет');
  return '<div class="card warn"><h3>'+RISK.title+'</h3>'+
    '<p>Вы употребляете никотин '+срок+'. '+t.lead+'</p>'+
    '<ul class="risk">'+t.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>'+
    '<p class="risk-note">'+RISK.note+'</p></div>';
}
function goal(n){ if(window.ym) try{ ym(110722782,'reachGoal',n); }catch(e){} }

/* --- RENDER --- */
function render(){
  let list, topCode, prof;
  if(hasData){
    list=score(); topCode=list[0].code;
  } else {
    topCode=urlCode||'habit'; list=[];
  }
  prof=(typeof PROFILES!=='undefined'&&PROFILES[topCode])||PROFILES.habit;

  const bars=list.length>0
    ? '<div class="bars">'+list.slice(0,5).map((c,i)=>'<div class="bar-row'+(i===0?' top':'')+'"><div class="bar-head"><span class="bar-name">'+c.icon+' '+c.label+'</span><span class="bar-pct">'+c.pct+'%</span></div><div class="bar-track"><i data-w="'+c.pct+'"></i></div></div>').join('')+'</div>'
    : '';

  let html;

  if(!fullMode){
    /* STATE 1: только бары + инструкция + кнопка в бот */
    const botLink='https://t.me/SvezhiyVzdohBot?start=gotov_'+topCode;
    html=
      '<div class="eyebrow">ВАШ РЕЗУЛЬТАТ</div>'+
      '<h1>'+prof.title+'</h1>'+
      bars+
      '<div class="card" style="gap:16px">'+
        '<p style="font-size:1.25rem;font-weight:800;color:var(--w);line-height:1.25;letter-spacing:-.02em">Как получить полный разбор</p>'+
        '<p>Нажмите кнопку ниже. Вас перекинет в Telegram-бот — там пройдут расчёты и бот выдаст персональный разбор вашей диагностики и метод как бросить курить без ломки, стресса и переедания.</p>'+
      '</div>'+
      '<a class="btn" href="'+botLink+'" target="_blank" rel="noopener" style="margin-top:4px">Получить разбор и метод</a>'+
      '<p class="price-note" style="text-align:center">Откроется Telegram — это бесплатно</p>';
  } else {
    /* STATE 2: полный разбор + метод + кнопка на клуб (без цены и таймера) */
    const st=stageOf();
    const S=(typeof STAGES!=='undefined'&&STAGES[st])||{n:'',lead:'',body:'',warn:''};
    const m=moneyCalc();
    const steps=METHOD.steps.map((s,i)=>
      '<div class="mstep"><div class="mstep-n"><span class="mstep-num">'+(i+1)+'</span><span class="mstep-cat">'+s.n+'</span></div><h4>'+s.t+'</h4>'+(s.sub?'<p class="mstep-sub">'+s.sub+'</p>':'')+'<p>'+s.d+'</p>'+(s.d15?'<p>'+s.d15+'</p>':'')+(s.d2?'<p class="mstep-you">'+s.d2+'</p>':'')+'</div>').join('');
    const moneyBlock=hasData
      ? '<div class="card"><h3>За это время вы отдали</h3>'+
          '<p style="font-size:1.5rem;font-weight:800;color:var(--acc);letter-spacing:-.02em">'+fmt(m.total)+' ₽ <span class="usd-inline">≈ '+usd(m.total)+'</span></p>'+
          '<p>И продолжаете отдавать примерно '+fmt(m.month)+' ₽ <span class="usd-inline">≈ '+usd(m.month)+'</span> каждый месяц.</p></div>'+riskCard()
      : '';
    const initial=urlName?urlName.trim()[0].toUpperCase():'🌿';
    const avatarBlock=urlName
      ? '<div class="avatar-wrap"><div class="avatar-ring">'+initial+'</div><span class="avatar-name">'+urlName+'</span></div>'
      : '';
    const clubHref=urlUid
      ? 'http://178.105.228.42:8080/go?uid='+urlUid+'&to=gotov_club'
      : '../club/';
    html=
      '<div class="eyebrow">ВАШ РЕЗУЛЬТАТ</div>'+
      avatarBlock+
      '<h1>'+prof.title+'</h1>'+
      bars+
      '<div class="card"><h3>Что это значит</h3><p>'+prof.verdict+'</p></div>'+
      (val('tries')==='none'&&prof.whyNone
        ?'<div class="card"><h3>Где это обычно срывается</h3><p>'+prof.whyNone+'</p></div>'
        :'<div class="card"><h3>Почему срывались раньше</h3><p>'+prof.why+'</p></div>')+
      (S.n?'<div class="card warn"><span class="stage-badge">'+S.n+'</span><h3 style="margin-top:2px">'+S.lead+'</h3><p>'+S.body+'</p><p><strong>'+S.warn+'</strong></p></div>':'')+
      moneyBlock+
      '<div class="card"><h3>Что с этим делаем</h3><ul class="plan">'+prof.plan.map(p=>'<li><b>—</b><span>'+p+'</span></li>').join('')+'</ul></div>'+
      '<div class="method-head"><h2>'+METHOD.title+'</h2><p>'+METHOD.lead+'</p></div>'+
      steps+
      '<div class="card"><h3>Сработает ли это у вас</h3><p>'+prof.fit+'</p></div>'+
      '<div class="card warn"><h3>'+METHOD.honest.title+'</h3><p>'+METHOD.honest.body+'</p><p><strong>'+METHOD.honest.body2+'</strong></p></div>'+
      '<div class="outro"><h2>'+OUTRO.title+'</h2><p>'+OUTRO.body+'</p></div>'+
      '<div class="alone">'+
        (OUTRO.points||[]).map((p,i)=>'<div class="al"><span class="al-n">'+(i+1)+'</span><span class="al-t"><b>'+p.t+'</b><span>'+p.d+'</span></span></div>').join('')+
      '</div>'+
      (OUTRO.after?'<p class="outro-after">'+OUTRO.after+'</p>':'')+
      '<div class="cta-wrap">'+
        '<a class="btn" id="buy-btn" href="'+clubHref+'">Программа «Свежий Вздох»</a>'+
        '<p class="price-note">Закрытый клуб — бросаем вместе, без ломки и стресса</p>'+
        '<p class="privacy">Диагностика носит информационный характер и не является медицинским заключением.</p>'+
      '</div>';
  }

  document.getElementById('root').innerHTML='<div class="wrap">'+html+'</div>';

  setTimeout(()=>{
    document.querySelectorAll('.bar-track i').forEach((el,i)=>setTimeout(()=>{el.style.width=el.dataset.w+'%';},90+i*110));
    goal('gotov_razbor_view');
    const btn=document.getElementById('buy-btn');
    if(btn) btn.addEventListener('click',()=>goal('gotov_club_click'));
  },220);
}

if(typeof CONFIG==='undefined'||typeof PROFILES==='undefined'){
  document.getElementById('root').innerHTML='<div class="loader"><p>Ошибка загрузки. <a href="../" style="color:var(--acc)">Пройти диагностику заново</a></p></div>';
} else {
  render();
}

})();
</script>
</body>
</html>
